name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: drop
          POSTGRES_PASSWORD: drop
          POSTGRES_DB: drop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drop -d drop_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://drop:drop@localhost:5432/drop_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check src tests scripts bench
      - run: uv run ruff check src tests scripts bench
      - run: uv run pytest -q
